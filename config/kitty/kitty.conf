# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Restyled 2026-10-12 to match the desktop (Waybar Catppuccin Mocha + JetBrains Mono).
# Previous config: ~/.config/hypr/backup-utilities-2026-10-12/kitty.conf
# Themes live in $HOME/.config/kitty/kitty-themes/ (01-Wallust.conf follows the wallpaper,
# but its red/green are near-black, so Catppuccin is used for readable ANSI colors).

include ./kitty-themes/02-Catppuccin-Mocha.conf

# ── Font ───────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
modify_font      cell_height 112%
disable_ligatures cursor

# ── Window: translucent so Hyprland's blur shows through ──
background            #11111b
background_opacity    0.82
dynamic_background_opacity 1
window_padding_width  10 14
hide_window_decorations yes
confirm_os_window_close 0
linux_display_server  auto

# ── Cursor: beam with the smooth trail animation ───────
cursor_shape              beam
cursor_beam_thickness     2
cursor                    #cba6f7
cursor_text_color         #11111b
cursor_trail              3
cursor_trail_decay        0.08 0.35
cursor_trail_start_threshold 2
cursor_blink_interval     0.6 ease-in-out
cursor_stop_blinking_after 12

# ── Selection / links ──────────────────────────────────
selection_foreground  #11111b
selection_background  #cba6f7
url_color             #89b4fa
url_style             curly
detect_urls           yes

# ── Scrolling ──────────────────────────────────────────
scrollback_lines      10000
wheel_scroll_min_lines 1
touch_scroll_multiplier 2.0

# ── Tabs (Ctrl+Shift+T new, Ctrl+Shift+←/→ switch) ─────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_margin_height 4 4
tab_title_template    " {index}  {title[:24]} "
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #a6adc8
inactive_tab_background #1e1e2e
tab_bar_background      none

# ── Splits (Ctrl+Shift+Enter) ──────────────────────────
enabled_layouts       splits, stack
active_border_color   #cba6f7
inactive_border_color #313244
window_border_width   1pt
inactive_text_alpha   0.75

# ── Misc ───────────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.15
visual_bell_color     #f38ba8

# Accent from the wallpaper (written by ~/.config/hypr/scripts/AccentGuard.py)
include accent.conf

# Hyprland arranges windows: don't reopen at the last size / maximized state (kitty 0.49 remembers it)
remember_window_size no
