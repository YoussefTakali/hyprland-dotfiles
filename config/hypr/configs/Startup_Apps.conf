exec-once = $HOME/.config/hypr/scripts/StartupWallpaper.sh
# Initialize the graphical session and screen-sharing portals.
exec-once = $HOME/.config/hypr/scripts/SessionInit.sh
exec-shutdown = systemctl --user stop hyprland-dotfiles-session.target
# Overview starts on demand through OverviewToggle.sh.
# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Commands and Apps to be executed at launch (vendor defaults)

$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

$wallDIR=$HOME/Pictures/wallpapers
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper=""

### wallpaper stuff ###
#exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop" $livewallpaper

# wallpaper random
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

### Startup ###

# Drop Down terminal
# See Bug#810 https://github.com/JaKooLit/Hyprland-Dots/issues/810#issuecomment-3351947644
# Start the dropdown terminal on its keybinding, rather than loading Kitty during login.
# exec-once = $HOME/.config/hypr/scripts/Dropterminal.sh kitty &


# Polkit (Polkit Gnome / KDE)
exec-once = $scriptsDir/Polkit.sh

# starup apps
# exec-once = nm-applet --indicator   # tray icon replaced by the Waybar Wi-Fi module + NetMenu.sh (2026-10-12)
# The Waybar network menu replaces nm-applet and nm-tray.
#exec-once = ags
#exec-once = blueman-applet
#exec-once = rog-control-center
exec-once = $scriptsDir/WaybarMode.sh --refresh

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders
# exec-once = $UserScripts/RainbowBorders.sh   # replaced by the accent gradient in UserDecorations.conf (2026-10-12)

# hypridle for hyprlock
exec-once = hypridle

# Resume Hyprsunset if state is "on" from previous session
exec-once = $scriptsDir/Hyprsunset.sh init

# Here are list of features available but disabled by default
# Persistent wallpaper
# exec-once = swww-daemon --format xrgb && swww img $HOME/Pictures/wallpapers/mecha-nostalgia.png 

# Gnome polkit for NixOS
#exec-once = $scriptsDir/Polkit-NixOS.sh

# xdg-desktop-portal-hyprland (should be auto starting. However, you can force to start)
#exec-once = $scriptsDir/PortalHyprland.sh
exec-once = blueman-applet
