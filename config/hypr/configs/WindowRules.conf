# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Vendor defaults for window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# NOTES: This is for Hyprland > 0.53.2

# note for ja: This should NOT be implemented on Debian and Ubuntu

# windowrule - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, tag browser
windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$, tag browser
windowrule = match:class ^(chrome-.+-Default)$, tag browser # Chrome PWAs
windowrule = match:class ^([Cc]hromium)$, tag browser
windowrule = match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$, tag browser
windowrule = match:class ^(Brave-browser(-beta|-dev|-unstable)?)$, tag browser
windowrule = match:class ^([Tt]horium-browser|[Cc]achy-browser)$, tag browser
windowrule = match:class ^(zen-alpha|zen)$, tag browser

# notif tags - FIXED: removed + sign
windowrule = match:class ^(swaync-control-center|swaync-notification-window|swaync-client)$, tag notif

# KooL settings tag - FIXED: removed + sign
windowrule = match:title ^(KooL Quick Cheat Sheet)$, tag KooL_Cheat
windowrule = match:title ^(KooL Hyprland Settings)$, tag KooL_Settings
windowrule = match:class ^(nwg-displays|nwg-look)$, tag KooL-Settings

# terminal tags - FIXED: removed + sign
windowrule = match:class ^(Alacritty|kitty|kitty-dropterm)$, tag terminal

# email tags - FIXED: removed + sign
windowrule = match:class ^([Tt]hunderbird|org.gnome.Evolution)$, tag email
windowrule = match:class ^(eu.betterbird.Betterbird)$, tag email

# project tags - FIXED: removed + sign
windowrule = match:class ^(codium|codium-url-handler|VSCodium)$, tag projects
windowrule = match:class ^(VSCode|code|code-url-handler)$, tag projects
windowrule = match:class ^(jetbrains-.+)$, tag projects # JetBrains IDEs

# screenshare tags - FIXED: removed + sign
windowrule = match:class ^(com.obsproject.Studio)$, tag screenshare

# IM tags - FIXED: removed + sign
windowrule = match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$, tag im
windowrule = match:class ^([Ff]erdium)$, tag im
windowrule = match:class ^([Ww]hatsapp-for-linux)$, tag im
windowrule = match:class ^(ZapZap|com.rtosta.zapzap)$, tag im
windowrule = match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop)$, tag im
windowrule = match:class ^(teams-for-linux)$, tag im
windowrule = match:class ^(im.riot.Riot|Element)$, tag im # Element Matrix client

# game tags - FIXED: removed + sign
windowrule = match:class ^(gamescope)$, tag games
windowrule = match:class ^(steam_app_\d+)$, tag games

# gamestore tags - FIXED: removed + sign
windowrule = match:class ^([Ss]team)$, tag gamestore
windowrule = match:title ^([Ll]utris)$, tag gamestore
windowrule = match:class ^(com.heroicgameslauncher.hgl)$, tag gamestore

# file-manager tags - FIXED: removed + sign
windowrule = match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt)$, tag file-manager
windowrule = match:class ^(app.drey.Warp)$, tag file-manager

# wallpaper tags - FIXED: removed + sign
windowrule = match:class ^([Ww]aytrogen)$, tag wallpaper

# multimedia tags - FIXED: removed + sign
windowrule = match:class ^([Aa]udacious)$, tag multimedia

# multimedia-video tags - FIXED: removed + sign
windowrule = match:class ^([Mm]pv|vlc)$, tag multimedia_video

# settings tags - FIXED: removed + sign
windowrule = match:title ^(ROG Control)$, tag settings
windowrule = match:class ^(wihotspot(-gui)?)$, tag settings # wifi hotspot
windowrule = match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$, tag settings # Disk usage analyzer
windowrule = match:class ^(gnome-disks|wihotspot(-gui)?)$, tag settings
windowrule = match:title (Kvantum Manager), tag settings
windowrule = match:class ^(file-roller|org.gnome.FileRoller)$, tag settings # archive manager
windowrule = match:class ^(nm-applet|nm-connection-editor|blueman-manager)$, tag settings
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, tag settings
windowrule = match:class ^(qt5ct|qt6ct|[Yy]ad)$, tag settings
windowrule = match:class (xdg-desktop-portal-gtk), tag settings
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, tag settings
windowrule = match:class ^([Rr]ofi)$, tag settings

# viewer tags - FIXED: removed + sign
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$, tag viewer # system monitor
windowrule = match:class ^(evince)$, tag viewer # document viewer 
windowrule = match:class ^(eog|org.gnome.Loupe)$, tag viewer # image viewer

# Some special override rules
windowrule = no_blur 1, match:tag multimedia_video*
windowrule = opacity 1.0, match:tag multimedia_video*
 
# POSITION
windowrule = center 1, match:tag KooL_Cheat*
windowrule = center 1, match:title negative:(.*[Tt]hunar.*), match:class ([Tt]hunar)$
windowrule = center 1, match:title ^(ROG Control)$
windowrule = center 1, match:tag KooL-Settings*
windowrule = center 1, match:title ^(Keybindings)$
windowrule = center 1, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = center 1, match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = center 1, match:class ^([Ff]erdium)$
windowrule = move 72% 7%, match:title ^(Picture-in-Picture)$ 

# FLOAT
windowrule = float 1, match:tag KooL_Cheat*
windowrule = float 1, match:tag wallpaper*
windowrule = float 1, match:tag settings*
windowrule = float 1, match:tag viewer*
windowrule = float 1, match:tag KooL-Settings*
windowrule = float 1, match:class ([Zz]oom|onedriver|onedriver-launcher)$
windowrule = float 1, match:title (Calculator), match:class (org.gnome.Calculator)
windowrule = float 1, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule = float 1, match:class ^([Qq]alculate-gtk)$
windowrule = float 1, match:class ^([Ff]erdium)$
windowrule = float 1, match:title ^(Picture-in-Picture)$

# windowrule - float popups and dialogue
windowrule = float 1, match:title ^(Authentication Required)$
windowrule = center 1, match:title ^(Authentication Required)$
windowrule = float 1, match:title negative:(.*codium.*|.*VSCodium.*), match:class (codium|codium-url-handler|VSCodium)
windowrule = float 1, match:title negative:(Heroic Games Launcher), match:class ^(com.heroicgameslauncher.hgl)$
windowrule = float 1, match:title negative:^([Ss]team)$, match:class ^([Ss]team)$
windowrule = float 1, match:title negative:(.*[Tt]hunar.*), match:class ([Tt]hunar)$

windowrule = float 1, match:title ^(Add Folder to Workspace)$
windowrule = size 70% 60%, match:title ^(Add Folder to Workspace)$
windowrule = center 1, match:title ^(Add Folder to Workspace)$

windowrule = float 1, match:title ^(Save As)$
windowrule = size 70% 60%, match:title ^(Save As)$
windowrule = center 1, match:title ^(Save As)$

windowrule = float 1, match:initial_title (Open Files)
windowrule = size 70% 60%, match:initial_title (Open Files)

windowrule = float 1, match:title ^(SDDM Background)$
windowrule = center 1, match:title ^(SDDM Background)$
windowrule = size 16% 12%, match:title ^(SDDM Background)$
# END of float popups and dialogue

# OPACITY
windowrule = opacity 0.99 0.8, match:tag browser*
windowrule = opacity 0.9 0.8, match:tag projects*
windowrule = opacity 0.94 0.86, match:tag im*
windowrule = opacity 0.94 0.86, match:tag multimedia*
windowrule = opacity 0.9 0.8, match:tag file-manager*
windowrule = opacity 0.9 0.7, match:tag terminal*
windowrule = opacity 0.8 0.7, match:tag settings*
windowrule = opacity 0.82 0.75, match:tag viewer*
windowrule = opacity 0.9 0.7, match:tag wallpaper*
windowrule = opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9 0.8, match:class ^(deluge)$
windowrule = opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
windowrule = opacity 0.95 0.75, match:title ^(Picture-in-Picture)$

# SIZE
windowrule = size 65% 90%, match:tag KooL_Cheat*
windowrule = size 70% 70%, match:tag wallpaper*
windowrule = size 70% 70%, match:tag settings*
windowrule = size 60% 70%, match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = size 60% 70%, match:class ^([Ff]erdium)$

# PINNING
windowrule = pin 1, match:title ^(Picture-in-Picture)$

# extras
windowrule = keep_aspect_ratio 1, match:title ^(Picture-in-Picture)$

# BLUR & FULLSCREEN
windowrule = no_blur 1, match:tag games*
windowrule = fullscreen 1, match:tag games*

# This not gonna take the focus to the window that appears when hovering over some of the parts of the IntelliJ Products 
windowrule = no_initial_focus 1, match:class ^(jetbrains-*)
windowrule = no_initial_focus 1, match:title ^(wind.*)$

# LAYER RULES - Keep layerrulev2 (not deprecated)
# Hyprland 0.53.2+ correct layerrule syntax
# Updated syntax for recent Hyprland versions
