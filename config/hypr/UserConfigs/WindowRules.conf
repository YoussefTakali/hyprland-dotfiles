# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# Joi desktop companion: small floating window on the right
windowrule = float 1, match:class ^(joi)$
windowrule = size 460 820, match:class ^(joi)$
windowrule = move (monitor_w-480) 70, match:class ^(joi)$

# Rofi popups: blur behind the translucent background + a soft pop-in when they open
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.1
layerrule = match:namespace rofi, animation popin 92%

# Notifications + notification center: blur behind the glass, soft fade
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.1
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.1

# Quickshell power menu (Wlogout.sh → PowerMenu.sh): blur the desktop behind its dark tint, fade in/out
layerrule = match:namespace qs-power, blur on
layerrule = match:namespace qs-power, ignore_alpha 0.0
layerrule = match:namespace qs-power, animation fade

# Glass Islands Waybar (2026-10-28): blur behind the translucent islands only (ignore_alpha skips the transparent gaps)
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.3
layerrule = match:namespace qs-calendar, blur on
layerrule = match:namespace qs-calendar, ignore_alpha 0.2

# Keyboard Shortcuts app (UserScripts/Shortcuts.py): a floating, centred window
windowrule = float on, match:class ^(io.github.YoussefTakali.Shortcuts)$
windowrule = size 780 700, match:class ^(io.github.YoussefTakali.Shortcuts)$
windowrule = center on, match:class ^(io.github.YoussefTakali.Shortcuts)$
