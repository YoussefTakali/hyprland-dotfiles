# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this


# Middle-click (scroll wheel) pastes the selected text, like on X11/GNOME (KooL's SystemSettings.conf turns it off)
misc {
  middle_click_paste = true
}

# Windows on special (scratchpad) workspaces use 80% of the screen, centred: 10% margins on each side.
# (Replaces dwindle:special_scale_factor = 0.8, deprecated in Hyprland 0.57. Sized for 1920x1080.)
workspace = s[true], gapsout:108 192 108 192
