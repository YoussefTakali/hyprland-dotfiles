# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  # Focused window: one solid accent color from the wallpaper (wallust)
  col.active_border = $color13
  col.inactive_border = rgba(ffffff10)
}

decoration {
  rounding = 12
         
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 7
    render_power = 2
    offset = 0 2

    # soft accent glow around the focused window, plain dark shadow for the rest
    color = rgba(af5ce52e)
    color_inactive = rgba(00000033)
  }


  blur {
    enabled = true	
    size = 6
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color13

	groupbar {
		col.active = rgb(39393C)
  }
}
