# ======================================================================
#  ULTIMATE PACK  - best-of end-4 / Omarchy / ML4W / HyDE on top of JaKooLit
#  Loaded last (from UserSettings.conf), so it overrides without editing any JaKooLit file.
#  Disable everything: comment out the "source = ...Ultimate.conf" line in UserSettings.conf
# ======================================================================
source = $HOME/.config/hypr/UserConfigs/Ultimate/Settings.conf
source = $HOME/.config/hypr/UserConfigs/Ultimate/Rules.conf
source = $HOME/.config/hypr/UserConfigs/Ultimate/Keybinds.conf
source = $HOME/.config/hypr/UserConfigs/Ultimate/Look.conf   # written by UserScripts/ThemeSwitch.sh
