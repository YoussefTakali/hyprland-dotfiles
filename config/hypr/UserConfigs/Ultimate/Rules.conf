# Window rules from end-4 (hyprland/rules.lua) that JaKooLit's defaults don't already cover.

# File pickers / browser dialogs -> float + centered
windowrule = float on, match:title ^(Open File|Open Folder|Select a File|File Upload|Choose wallpaper)(.*)$
windowrule = center on, match:title ^(Open File|Open Folder|Select a File|File Upload|Choose wallpaper)(.*)$
windowrule = size (monitor_w*0.6) (monitor_h*0.65), match:title ^(Open File|Open Folder|Select a File|File Upload|Choose wallpaper)(.*)$
windowrule = float on, match:title ^(.*)(wants to save|wants to open)$
windowrule = center on, match:title ^(.*)(wants to save|wants to open)$

# Settings apps -> float, centered, 45% of the screen
windowrule = float on, match:class ^(nm-connection-editor|blueman-manager|pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size (monitor_w*0.45) (monitor_h*0.45), match:class ^(nm-connection-editor|blueman-manager|pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = center on, match:class ^(nm-connection-editor|blueman-manager)$

# "X is sharing your screen" bars -> small, pinned, bottom-center instead of a tiled window
windowrule = float on, match:title .*is sharing (a window|your screen).*
windowrule = pin on, match:title .*is sharing (a window|your screen).*
windowrule = move (monitor_w*.5-window_w*.5) (monitor_h-window_h-12), match:title .*is sharing (a window|your screen).*

# Picture-in-Picture: catch every spelling (Firefox/Chromium/Discord), JaKooLit only matches one
windowrule = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keep_aspect_ratio on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = size (monitor_w*0.25) (monitor_h*0.25), match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Games: lowest input latency (needs allow_tearing in Settings.conf)
windowrule = immediate on, match:tag games
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:title .*[Mm]inecraft.*

# Installer / settings windows: always fully opaque (readable over any wallpaper)
windowrule = opaque on, match:class ^(io.github.YoussefTakali.(DesktopSetup|Shortcuts))$
