# Keybinds from Omarchy (default/hypr/bindings/*.lua) - only keys that were FREE in your setup.
$UserScripts = $HOME/.config/hypr/UserScripts
$scriptsDir = $HOME/.config/hypr/scripts

bindd = SUPER CTRL, T, theme switcher (look + animations), exec, $UserScripts/ThemeSwitch.sh
bindd = SUPER, O, pop window out (float + pin) / back, exec, $UserScripts/WindowPop.sh
bindd = SUPER, BackSpace, toggle transparency of window, setprop, active opaque toggle
bindd = SUPER SHIFT, BackSpace, zen mode (no gaps/borders/bar), exec, $UserScripts/ZenMode.sh
bindd = SUPER SHIFT, comma, dismiss all notifications, exec, swaync-client -C
bindd = SUPER CTRL, I, toggle idle/auto-lock, exec, $scriptsDir/Hypridle.sh toggle
bindd = SUPER, Escape, power menu, exec, $scriptsDir/Wlogout.sh
bindd = SUPER SHIFT, T, next theme, exec, $UserScripts/ThemeSwitch.sh --next
bindd = SUPER CTRL SHIFT, T, previous theme, exec, $UserScripts/ThemeSwitch.sh --prev
