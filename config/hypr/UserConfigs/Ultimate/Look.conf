# animation: END-4 - Material 2026
# shape: bar_radius=14 item_radius=10 bar_alpha=0.38 border=1 rofi_radius=16
# Best-of mix: end-4 frosted glass + squircle corners, ML4W soft deep shadow,
# your wallust gradient borders (follow the wallpaper + RainbowBorders), end-4 floating-window snapping.
general {
  border_size = 2
  gaps_in = 4
  gaps_out = 8
  gaps_workspaces = 50
  col.active_border = $color13 $color12 $color14 45deg
  col.inactive_border = rgba(ffffff10)
  snap {
    enabled = true
    window_gap = 4
    monitor_gap = 8
    respect_gaps = true
  }
}
decoration {
  rounding = 16
  rounding_power = 2.5
  active_opacity = 1.0
  inactive_opacity = 0.87
  dim_inactive = true
  dim_strength = 0.05
  dim_special = 0.3
  shadow {
    enabled = true
    range = 28
    render_power = 3
    offset = 0 3
    color = rgba(00000055)
    color_inactive = rgba(00000030)
  }
  blur {
    enabled = true
    size = 10
    passes = 3
    xray = true
    noise = 0.03
    contrast = 0.89
    brightness = 1
    vibrancy = 0.5
    vibrancy_darkness = 0.5
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
    popups_ignorealpha = 0.6
  }
}
