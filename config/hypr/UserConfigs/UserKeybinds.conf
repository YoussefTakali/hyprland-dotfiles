# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME



# Media keys — bindl so they also work on the lock screen
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioStop,  exec, playerctl stop
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
# Keyboard shortcuts for music (work everywhere, incl. lock screen)
bindld = $mainMod ALT, P,      music play/pause, exec, playerctl play-pause
bindld = $mainMod ALT, period, music next,       exec, playerctl next
bindld = $mainMod ALT, comma,  music previous,   exec, playerctl previous
bindeld = $mainMod ALT, bracketright, music forward 10s, exec, playerctl position 10+
bindeld = $mainMod ALT, bracketleft,  music back 10s,    exec, playerctl position 10-
# Lock screen
bindd = $mainMod, L, lock screen, exec, ~/.config/hypr/scripts/LockScreen.sh



# Utilities hub + screen recorder (UserScripts/UtilityHub.sh, ScreenRecord.sh)
bindd = $mainMod, X, utilities hub, exec, $UserScripts/UtilityHub.sh
bindd = $mainMod ALT, Print, record screen (start/stop), exec, $UserScripts/ScreenRecord.sh --toggle
bindd = $mainMod ALT, X, color picker, exec, $UserScripts/ColorPicker.sh
bindd = $mainMod ALT, T, text grab (OCR), exec, $UserScripts/OcrGrab.sh

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# Joi companion: Super+J talk (toggle, or hold in push-to-talk mode), Super+Shift+J show/hide, Super+Alt+J stop her
bindld = $mainMod, J, Joi talk, exec, ~/.local/bin/joi-ctl key-down
bindlr = $mainMod, J, exec, ~/.local/bin/joi-ctl key-up
bindd = $mainMod SHIFT, J, Joi show/hide, exec, ~/.local/bin/joi-ctl toggle-window
bindld = $mainMod ALT, J, Joi stop, exec, ~/.local/bin/joi-ctl stop

# Spotify keeps playing when "closed": Super+Q hides it in a hidden workspace instead (other windows close as usual)
unbind = $mainMod, Q
bindd = $mainMod, Q, close window (Spotify is hidden instead), exec, $UserScripts/CloseWindow.sh
bindd = $mainMod ALT, M, show or hide Spotify, exec, $UserScripts/SpotifyToggle.sh

# Shortcuts added with the Keyboard Shortcuts app
source = $UserConfigs/CustomShortcuts.conf

# Animated login themes. Shift+Enter previews the selected preset.
bindd = $mainMod CTRL ALT, L, login theme chooser, exec, python3 $scriptsDir/LoginThemes.py
