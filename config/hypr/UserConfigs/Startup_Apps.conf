# Commands and Apps to be executed at launch


# Video wallpaper: restores the last one chosen with Super+W (no-op when an image is the wallpaper)
exec-once = sleep 2 && ~/.config/hypr/UserScripts/LiveWallpaper.sh --restore

# Volume / brightness OSD (Quickshell, 2026-10-28)
exec-once = qs -p ~/.config/quickshell/osd/shell.qml

# Middle-click pastes what you copied (Ctrl+C) too: every text copy is mirrored into the primary selection
exec-once = wl-paste --type text --watch wl-copy --primary
