# /* ---- 💫 Clean Hyprlock config (fixed media) 💫 ---- */

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

# Smooth fade in/out of the whole lock screen and the password field
animations {
    enabled = true
    bezier = smoothOut, 0.22, 1, 0.36, 1
    bezier = smoothInOut, 0.65, 0, 0.35, 1
    animation = fadeIn, 1, 6, smoothOut
    animation = fadeOut, 1, 5, smoothInOut
    animation = inputFieldColors, 1, 4, smoothOut
    animation = inputFieldFade, 1, 4, smoothOut
    animation = inputFieldWidth, 1, 4, smoothOut
    animation = inputFieldDots, 1, 2, smoothOut
}

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

# ── Background ─────────────────────────────────────────
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0, 0, 0)

    blur_size = 4
    blur_passes = 3
    noise = 0.0080
    contrast = 1.1000
    brightness = 0.7000
    vibrancy = 0.1500
    vibrancy_darkness = 0.0
}

# ── Time ───────────────────────────────────────────────
label {
    text = cmd[update:1000] date +'%I:%M'
    color = $color8
    font_size = 160
    font_family = JetBrainsMono Nerd Font Thin
    position = 0, 60
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +'%p  :%S'
    color = rgba(255, 255, 255, 0.35)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Light
    position = 0, -55
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────
label {
    text = cmd[update:18000000] date +'%A, %-d %B'
    color = $color13
    font_size = 24
    font_family = JetBrainsMono Nerd Font Light
    position = 0, -100
    halign = center
    valign = center
}

# ── Divider ────────────────────────────────────────────
label {
    text = ───────────────
    color = rgba(255, 255, 255, 0.12)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}

# ── User ───────────────────────────────────────────────
label {
    text = $USER
    color = $color9
    font_size = 18
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 340
    halign = center
    valign = bottom
}

# ── Password field ─────────────────────────────────────
input-field {
    size = 280, 60
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.06)
    capslock_color = rgb(255, 200, 80)
    font_color = $color13
    fade_on_empty = true
    font_family = JetBrainsMono Nerd Font Light
    placeholder_text = <i><span foreground="##ffffff44"> password</span></i>
    hide_input = false
    rounding = 12
    check_color = $color13
    fail_color = $color12
    fail_text = <i>Wrong password · attempt $ATTEMPTS</i>
    fail_timeout = 2500
    fail_transition = 300
    position = 0, 260
    halign = center
    valign = bottom
}

# ── Keyboard layout ────────────────────────────────────
label {
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.28)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 230
    halign = center
    valign = bottom
}

# ── Bottom-right: uptime ───────────────────────────────
label {
    text = cmd[update:60000] uptime -p || $Scripts/UptimeNixOS.sh
    color = $color8
    font_size = 13
    font_family = JetBrainsMono Nerd Font Light
    position = -30, 55
    halign = right
    valign = bottom
}

# ── Bottom-right: battery ──────────────────────────────
label {
    text = cmd[update:5000] $Scripts/Battery.sh
    color = $color8
    font_size = 13
    font_family = JetBrainsMono Nerd Font Light
    position = -30, 30
    halign = right
    valign = bottom
}

# ── Bottom-right: notifications + mic ─────────────────
label {
    text = cmd[update:3000] $Scripts/LockInfo.sh
    color = $color8
    font_size = 13
    font_family = JetBrainsMono Nerd Font Light
    position = -30, 80
    halign = right
    valign = bottom
}

# ── Bottom-center: power buttons — grow + glow on hover (drawn by MusicUId.py), click twice (LockPower.sh) ──
label {
    text = cmd[update:40] $Scripts/MusicUI.sh glow_suspend
    color = $color8
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = $Scripts/LockPower.sh click suspend
    position = -80, 96
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh icon_suspend
    color = $color8
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = $Scripts/LockPower.sh click suspend
    position = -80, 108
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh glow_reboot
    color = $color8
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = $Scripts/LockPower.sh click reboot
    position = 0, 96
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh icon_reboot
    color = $color8
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = $Scripts/LockPower.sh click reboot
    position = 0, 108
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh glow_poweroff
    color = $color8
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = $Scripts/LockPower.sh click poweroff
    position = 80, 96
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh icon_poweroff
    color = $color8
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = $Scripts/LockPower.sh click poweroff
    position = 80, 108
    halign = center
    valign = bottom
}

label {
    text = cmd[update:250] $Scripts/LockPower.sh hint
    color = $color12
    font_size = 11
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 84
    halign = center
    valign = bottom
}

# ── Bottom-left: weather ───────────────────────────────
label {
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = $color8
    font_size = 13
    font_family = JetBrainsMono Nerd Font Light
    position = 30, 30
    halign = left
    valign = bottom
}
# ── Music card: audio output (click = next output; AudioOutput.py) ──
label {
    text = cmd[update:250] $Scripts/MusicUI.sh output
    color = $color8
    font_size = 11
    font_family = JetBrainsMono Nerd Font Propo
    onclick = python3 -I $Scripts/AudioOutput.py next
    position = 0, 763
    halign = center
    valign = bottom
}

# ── MUSIC CARD (modern) ───────────────────────────────
# 720x170 glass card: blurred album art + play circle, drawn by MusicCard.sh (blank when no player).
# Widgets are rendered by scripts/MusicUId.py; geometry must match the constants there.
image {
    path = $HOME/.cache/hyprlock-art/current.png
    reload_time = 1
    reload_cmd = $Scripts/MusicCard.sh
    size = 170
    rounding = 0
    border_size = 0
    position = 0, 790
    halign = center
    valign = bottom
}

# Album art (follows the track)
image {
    path = $HOME/.cache/hyprlock-art/blank.png
    reload_time = 2
    reload_cmd = $Scripts/LockAlbumArt.sh
    size = 130
    rounding = 18
    border_size = 0
    position = -275, 810
    halign = center
    valign = bottom
}

# Title / artist (left-aligned in the text column)
label {
    text = cmd[update:1000] $Scripts/MusicUI.sh title
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 770, 905
    halign = left
    valign = bottom
}

label {
    text = cmd[update:1000] $Scripts/MusicUI.sh artist
    color = $color13
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 770, 883
    halign = left
    valign = bottom
}

# Audio visualizer (cava, same bars as the Waybar one)
label {
    text = cmd[update:40] $Scripts/MusicUI.sh cava
    color = $color13
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 770, 848
    halign = left
    valign = bottom
}

# Progress bar + knob
label {
    text = cmd[update:50] $Scripts/MusicUI.sh bar
    color = rgb(255, 255, 255)
    font_size = 3
    font_family = JetBrainsMono Nerd Font
    position = -25, 819
    halign = center
    valign = bottom
}

# Drag-to-seek area over the progress bar (press, drag, release)
shape {
    size = 330, 26
    color = rgba(255, 255, 255, 0.01)
    onclick = python3 -I $Scripts/MusicScrub.py </dev/null >/dev/null 2>&1
    position = -25, 817
    halign = center
    valign = bottom
}

# Elapsed (left) / total (right)
label {
    text = cmd[update:500] $Scripts/MusicUI.sh pos
    color = rgba(255, 255, 255, 0.6)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 775, 798
    halign = left
    valign = bottom
}

label {
    text = cmd[update:1000] $Scripts/MusicUI.sh len
    color = rgba(255, 255, 255, 0.6)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = -825, 798
    halign = right
    valign = bottom
}

# Controls: icons grow on hover (MusicUId.py); transparent shapes give a comfortable click area
shape {
    size = 44, 44
    color = rgba(255, 255, 255, 0.01)
    rounding = 22
    border_size = 0
    onclick = playerctl previous
    position = 185, 853
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh icon_prev
    color = $color13
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = playerctl previous
    position = 185, 834
    halign = center
    valign = bottom
}

shape {
    size = 60, 60
    color = rgba(255, 255, 255, 0.01)
    rounding = 30
    border_size = 0
    onclick = playerctl play-pause
    position = 255, 845
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh icon_play
    color = $color13
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = playerctl play-pause
    position = 255, 832
    halign = center
    valign = bottom
}

shape {
    size = 44, 44
    color = rgba(255, 255, 255, 0.01)
    rounding = 22
    border_size = 0
    onclick = playerctl next
    position = 325, 853
    halign = center
    valign = bottom
}

label {
    text = cmd[update:40] $Scripts/MusicUI.sh icon_next
    color = $color13
    font_size = 20
    font_family = JetBrainsMono Nerd Font Propo
    onclick = playerctl next
    position = 325, 834
    halign = center
    valign = bottom
}

