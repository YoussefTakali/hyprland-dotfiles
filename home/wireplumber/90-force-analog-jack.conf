# Loads ~/.local/share/wireplumber/scripts/device/force-analog-profile.lua
# (keeps the 3.5mm jack output enabled despite broken jack detection).
wireplumber.components = [
  {
    name = device/force-analog-profile.lua, type = script/lua
    provides = custom.force-analog-profile
  }
]
wireplumber.profiles = {
  main = {
    custom.force-analog-profile = required
  }
}
